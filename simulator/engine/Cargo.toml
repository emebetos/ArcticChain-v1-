[package]
name = "arcticchain-engine"
description = "WASM bridge running the real HAL, mesh, compositor and harvesting code inside the dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arcticchain-hal = { path = "../../firmware-hal" }
arcticchain-mesh = { path = "../../mesh-net" }
arcticchain-compositor = { path = "../../compositor" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
