[workspace]
resolver = "2"
members = ["firmware-hal", "mesh-net", "compositor", "simulator/engine"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize", "fast"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = "0.10"
rand_core = "0.6"
rand_chacha = "0.3"

[profile.release]
opt-level = "s"
lto = true

[profile.dev.package."*"]
opt-level = 2
