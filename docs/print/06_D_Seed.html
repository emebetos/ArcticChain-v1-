</style></head><body><div class="page"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1632 1056" font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1632" height="1056" fill="#ffffff"/><rect x="40.0" y="40.0" width="1552.0" height="976.0" rx="0" fill="none" stroke="#1c1c1c" stroke-width="2"/><rect x="48.0" y="48.0" width="1536.0" height="960.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.7"/><rect x="40.0" y="40.0" width="1552.0" height="56.0" rx="0" fill="none" stroke="#1c1c1c" stroke-width="1.2"/><line x1="340.0" y1="40.0" x2="340.0" y2="96.0" stroke="#8a8a8a" stroke-width="0.8"/><text x="58.0" y="66.0" font-size="18" text-anchor="start" fill="#1c1c1c" font-weight="bold">D · SEED</text><text x="58.0" y="85.0" font-size="11" text-anchor="start" fill="#8a8a8a" font-weight="normal">R&amp;D BRIEF — DEGRADABLE MOTE</text><text x="358.0" y="63.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold">AF-D-101</text><text x="358.0" y="83.0" font-size="11" text-anchor="start" fill="#8a8a8a" font-weight="normal">REV 0 · 2026-11-12</text><text x="1574.0" y="74.0" font-size="12" text-anchor="end" fill="#b3261e" font-weight="bold">RESEARCH — NOT A PRODUCT</text><text x="50.0" y="150.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="1">THE IDEA</text><text x="60.0" y="180.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— A ~20 mm mote of printed electronics on biodegradable substrate — seed-dropped over a fuel break or burn scar.</text><text x="60.0" y="203.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— It sprouts into a temporary sensor skin for fire season, reports through cluster heads, and dissolves.</text><text x="60.0" y="226.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Zero e-waste, no retrieval, no grid to build — sensing that ENDS by design.</text><text x="60.0" y="249.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Materials/transient-electronics program — fundable R&amp;D, not a product. Every earlier rung must succeed first.</text><text x="50.0" y="420.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="1">RESEARCH TARGETS</text><rect x="50.0" y="448.0" width="920.0" height="320.0" rx="0" fill="none" stroke="#1c1c1c" stroke-width="1.2"/><text x="57.0" y="480.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="0.5">TARGET</text><text x="277.0" y="480.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="0.5">GOAL</text><line x1="50.0" y1="488.0" x2="970.0" y2="488.0" stroke="#1c1c1c" stroke-width="1.2"/><text x="57.0" y="504.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Mass</text><line x1="270.0" y1="488.0" x2="270.0" y2="528.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="277.0" y="504.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">&lt;1 g per mote (cluster head &lt;5 g)</text><line x1="50.0" y1="528.0" x2="970.0" y2="528.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="57.0" y="544.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Cost</text><line x1="270.0" y1="528.0" x2="270.0" y2="568.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="277.0" y="544.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">&lt;$1/unit at volume (printed, not assembled)</text><line x1="50.0" y1="568.0" x2="970.0" y2="568.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="57.0" y="584.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Life</text><line x1="270.0" y1="568.0" x2="270.0" y2="608.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="277.0" y="584.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">one fire season (~6 months) then degrade</text><line x1="50.0" y1="608.0" x2="970.0" y2="608.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="57.0" y="624.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Degradation</text><line x1="270.0" y1="608.0" x2="270.0" y2="648.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="277.0" y="624.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">complete in &lt;12 months, non-toxic residue</text><line x1="50.0" y1="648.0" x2="970.0" y2="648.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="57.0" y="664.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Comms</text><line x1="270.0" y1="648.0" x2="270.0" y2="688.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="277.0" y="664.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">duty-cycled LoRa or backscatter — rare TX, local clustering</text><line x1="50.0" y1="688.0" x2="970.0" y2="688.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="57.0" y="704.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Power</text><line x1="270.0" y1="688.0" x2="270.0" y2="728.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="277.0" y="704.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">printed battery + PV/TEG harvest — µW average</text><line x1="50.0" y1="728.0" x2="970.0" y2="728.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="57.0" y="744.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Sensing</text><line x1="270.0" y1="728.0" x2="270.0" y2="768.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="277.0" y="744.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">temp/RH/VOC minimum; optical smoke later</text><line x1="50.0" y1="768.0" x2="970.0" y2="768.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><line x1="50.0" y1="768.0" x2="970.0" y2="768.0" stroke="#1c1c1c" stroke-width="1.2"/><text x="50.0" y="800.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="1">ROADMAP GATES</text><text x="60.0" y="828.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Gate 1: university transient-electronics partner (SR&amp;ED eligible).</text><text x="60.0" y="851.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Gate 2: lab demo — printed mote senses temp + reports 10 m via cluster head.</text><text x="60.0" y="874.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Gate 3: field trial — 100 motes over 1 ha, one season, recoverable data.</text><text x="60.0" y="897.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Gate 4: degradable variant — residue confirms &lt;12 month breakdown.</text><text x="60.0" y="920.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Gate 5: scale — seed-drop tied to Anchor/Brick infrastructure.</text><text x="900.0" y="150.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="1">MATERIALS PATHWAY</text><rect x="900.0" y="178.0" width="760.0" height="264.0" rx="0" fill="none" stroke="#1c1c1c" stroke-width="1.2"/><text x="907.0" y="214.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="0.5">COMPONENT</text><text x="1107.0" y="214.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="0.5">CANDIDATE MATERIALS / APPROACH</text><line x1="900.0" y1="222.0" x2="1660.0" y2="222.0" stroke="#1c1c1c" stroke-width="1.2"/><text x="907.0" y="238.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Substrate</text><line x1="1100.0" y1="222.0" x2="1100.0" y2="266.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="1107.0" y="238.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">cellulose paper, silk fibroin, transient polymer</text><line x1="900.0" y1="266.0" x2="1660.0" y2="266.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="907.0" y="282.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Electronics</text><line x1="1100.0" y1="266.0" x2="1100.0" y2="310.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="1107.0" y="282.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">printed Zn/MnO₂ battery, printed sensors, organic TFT</text><line x1="900.0" y1="310.0" x2="1660.0" y2="310.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="907.0" y="326.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Energy</text><line x1="1100.0" y1="310.0" x2="1100.0" y2="354.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="1107.0" y="326.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">printed PV cell, thermoelectric, RF harvest</text><line x1="900.0" y1="354.0" x2="1660.0" y2="354.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="907.0" y="370.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Comms</text><line x1="1100.0" y1="354.0" x2="1100.0" y2="398.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="1107.0" y="370.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">backscatter (no TX) or ultra-low-power LoRa wake-up</text><line x1="900.0" y1="398.0" x2="1660.0" y2="398.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="907.0" y="414.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Deploy</text><line x1="1100.0" y1="398.0" x2="1100.0" y2="442.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="1107.0" y="414.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">seed pod form factor — germinates sensor on moisture</text><line x1="900.0" y1="442.0" x2="1660.0" y2="442.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><line x1="900.0" y1="442.0" x2="1660.0" y2="442.0" stroke="#1c1c1c" stroke-width="1.2"/><text x="900.0" y="560.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="1">WHY THIS MATTERS</text><text x="910.0" y="590.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Fire season is seasonal — permanent sensors waste 11 months.</text><text x="910.0" y="613.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Degradable motes match the threat's rhythm: deploy, vanish.</text><text x="910.0" y="636.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Billions-scale is materials R&amp;D, not drone fleet — mesh math supports it.</text><text x="910.0" y="659.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Precedent: DARPA/NSF computational-dust programs prove it's real.</text><text x="900.0" y="736.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="1">HONEST STATUS</text><text x="910.0" y="764.0" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal">— TRL ~2 — concept + literature. No ArcticChain mote exists yet.</text><text x="910.0" y="787.0" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal">— This sheet is a research brief, not a buildable BOM — deliberately.</text><text x="910.0" y="810.0" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal">— Swarm architecture is the same — only the node shrinks.</text><text x="910.0" y="833.0" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal">— Do NOT promise motes to funders until Gate 2 demo exists.</text><rect x="1032.0" y="896.0" width="560.0" height= tart" fill="#1c1c1c" font-weight="bold">AF-D-101</text><text x="1447.0" y="983.0" font-size="9" text-anchor="start" fill="#8a8a8a" font-weight="normal">UNITS</text><text x="1447.0" y="1000.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="bold">mm</text><text x="48.0" y="1038.0" font-size="10" text-anchor="start" fill="#b3261e" font-weight="normal">EMEBET INC. — PROPRIETARY &amp; CONFIDENTIAL</text></svg></div></body></html>
