</style></head><body><div class="page"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1632 1056" font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1632" height="1056" fill="#ffffff"/><rect x="40.0" y="40.0" width="1552.0" height="976.0" rx="0" fill="none" stroke="#1c1c1c" stroke-width="2"/><rect x="48.0" y="48.0" width="1536.0" height="960.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.7"/><rect x="40.0" y="40.0" width="1552.0" height="56.0" rx="0" fill="none" stroke="#1c1c1c" stroke-width="1.2"/><line x1="340.0" y1="40.0" x2="340.0" y2="96.0" stroke="#8a8a8a" stroke-width="0.8"/><text x="58.0" y="66.0" font-size="18" text-anchor="start" fill="#1c1c1c" font-weight="bold">H · MERIDIAN</text><text x="58.0" y="85.0" font-size="11" text-anchor="start" fill="#8a8a8a" font-weight="normal">MISSION CONCEPT — SATELLITE PAYLOAD</text><text x="358.0" y="63.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold">AF-H-101</text><text x="358.0" y="83.0" font-size="11" text-anchor="start" fill="#8a8a8a" font-weight="normal">REV 0 · 2026-11-12</text><text x="1574.0" y="74.0" font-size="12" text-anchor="end" fill="#b3261e" font-weight="bold">VISION — EARNED</text><text x="50.0" y="150.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="1">THE INSIGHT</text><text x="60.0" y="180.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— When the mesh needs backhaul beyond terrestrial reach, our own store-and-forward</text><text x="72.0" y="200.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">payload flies.</text><text x="60.0" y="223.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Nobody else launching smallsats has a deployed rural ground network waiting — the</text><text x="72.0" y="243.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">mesh IS the user-terminal layer.</text><text x="60.0" y="266.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— A text message or sensor packet needs COVERAGE, not Starlink bandwidth — a handful of</text><text x="72.0" y="286.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">CubeSats can blanket Canada.</text><text x="60.0" y="309.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Higher orbit is correct for THIS layer: bigger footprint per satellite = fewer</text><text x="72.0" y="329.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">needed.</text><text x="1130.0" y="148.0" font-size="15" text-anchor="middle" fill="#8a8a8a" font-weight="bold">ORBIT CONCEPT</text><circle cx="1130.0" cy="310.0" r="95.0" fill="none" stroke="#1c1c1c" stroke-width="1.5"/><circle cx="1130.0" cy="310.0" r="42.0" fill="#f2f5f9" stroke="#1c1c1c" stroke-width="1"/><text x="1130.0" y="315.0" font-size="12" text-anchor="middle" fill="#1c1c1c" font-weight="bold">EARTH</text><path d="M 945 310 A 185 62 0 0 1 1315 310" fill="none" stroke="#1a4f8a" stroke-width="1.5" stroke-dasharray="8 4"/><text x="1130.0" y="238.0" font-size="12" text-anchor="middle" fill="#1a4f8a" font-weight="bold">polar ~600–1000 km</text><text x="1130.0" y="402.0" font-size="12" text-anchor="middle" fill="#8a8a8a" font-weight="normal">inclination ~99° — Arctic coverage</text><text x="720.0" y="450.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="1">PAYLOAD — DERIVED FROM THE MESH</text><rect x="720.0" y="476.0" width="790.0" height="192.0" rx="0" fill="none" stroke="#1c1c1c" stroke-width="1.2"/><text x="727.0" y="500.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="0.5">ELEMENT</text><text x="917.0" y="500.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="0.5">IMPLEMENTATION</text><line x1="720.0" y1="508.0" x2="1510.0" y2="508.0" stroke="#1c1c1c" stroke-width="1.2"/><text x="727.0" y="524.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Radio</text><line x1="910.0" y1="508.0" x2="910.0" y2="540.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="917.0" y="524.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">UHF/S-band store-and-forward transceiver — LoRa-derived or CC1101-class</text><line x1="720.0" y1="540.0" x2="1510.0" y2="540.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="727.0" y="556.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Envelope</text><line x1="910.0" y1="540.0" x2="910.0" y2="572.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="917.0" y="556.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">same signed mesh-net format — satellite is just another hop</text><line x1="720.0" y1="572.0" x2="1510.0" y2="572.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="727.0" y="588.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Store</text><line x1="910.0" y1="572.0" x2="910.0" y2="604.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="917.0" y="588.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">onboard flash — holds envelopes until ground station passes</text><line x1="720.0" y1="604.0" x2="1510.0" y2="604.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="727.0" y="620.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Bus</text><line x1="910.0" y1="604.0" x2="910.0" y2="636.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="917.0" y="620.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">1U/3U CubeSat (GOMspace/EnduroSat/CubeSat Shop) or smallsat</text><line x1="720.0" y1="636.0" x2="1510.0" y2="636.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="727.0" y="652.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">Ground segment</text><line x1="910.0" y1="636.0" x2="910.0" y2="668.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><text x="917.0" y="652.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="normal">the deployed mesh + community gateways = user terminals</text><line x1="720.0" y1="668.0" x2="1510.0" y2="668.0" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="4 3"/><line x1="720.0" y1="668.0" x2="1510.0" y2="668.0" stroke="#1c1c1c" stroke-width="1.2"/><text x="50.0" y="430.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="1">MISSION PROFILE</text><text x="60.0" y="458.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Polar LEO constellation blankets Canada incl. North — messaging/sensor tier.</text><text x="60.0" y="481.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Latency: store-and-forward hours — right-sized for alerts, notices, telemetry.</text><text x="60.0" y="504.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Each sat serves hundreds of nodes per pass — plenty for text/sensor traffic.</text><text x="60.0" y="527.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Pathfinder: 2–6 sats prove the constellation, then scale regional.</text><text x="720.0" y="700.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="1">ASCENT &amp; FUNDING PATH</text><text x="730.0" y="728.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Ascent: hosted payload → university CubeSat (CSA) → dedicated smallsat (non-US rideshare) →</text><text x="742.0" y="748.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">pathfinder 6–12 sats → regional constellation.</text><text x="730.0" y="771.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Funding: CSA CubeSat Initiative · provincial/Indigenous services · IDEaS/defence dual-use ·</text><text x="742.0" y="791.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">anchor demand for domestic launch.</text><text x="50.0" y="640.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="1">HONEST STATUS</text><text x="60.0" y="670.0" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal">— Vision stage — no satellite exists. The mesh must prove itself first</text><text x="72.0" y="690.0" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal">(L1→swarm→revenue).</text><text x="60.0" y="713.0" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal">— This sheet is mission concept, not spacecraft design — payload inherits mesh</text><text x="72.0" y="733.0" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal">crypto/routing.</text><text x="60.0" y="756.0" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal">— Every earlier rung funds and justifies this one — the trailhead is the ground</text><text x="72.0" y="776.0" font-size="13" text-anchor="start" fill="#b3261e" font-weight="normal">network.</text><rect x="1032.0" y="896.0" width="560.0" height="120.0" rx="0" fill="none" stroke="#1c1c1c" stroke-width="1.4"/><line x1="1282.0" y1="896.0" x2="1282.0" y2="1016.0" stroke="#1c1c1c" stroke-width="1"/><text x="1044.0" y="916.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="bold">ARCTICCHAIN — RURAL NODE FLEET</text><text x="1044.0" y="934.0" font-size="12" text-anchor="start" fill="#1a4f8a" font-weight="bold">EMEBET INC. · emebetos.ca</text><text x="1044.0" y="953.0" font-size="10" text-anchor="start" fill="#8a8a8a" font-weight="normal">SOLE PROPRIETARY OWNER</text><text x="1044.0" y="967.0" font-size="10" text-anchor="start" fill="#8a8a8a" font-weight="normal">SURAFEL NEGUSSIE — PLANNER/MAKER</text><text x="1044.0" y="988.0" font-size="10" text-anchor="#b3261e" fill="bold" font-weight="normal">PROPRIETARY &amp; CONFIDENTIAL</text><text x="1044.0" y="1002.0" font-size="9" text-anchor="#b3261e" fill="#1c1c1c" font-weight="normal">UNAUTHORIZED DISTRIBUTION PROHIBITED</text><text x="1302.0" y="917.0" font-size="9" text-anchor="start" fill="#8a8a8a" font-weight="normal">DRAWN</text><text x="1302.0" y="934.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="bold">Surafel Negussie</text><text x="1302.0" y="950.0" font-size="9" text-anchor="start" fill="#8a8a8a" font-weight="normal">DATE</text><text x="1302.0" y="967.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="bold">2026-11-12</text><text x="1302.0" y="983.0" font-size="9" text-anchor="start" fill="#8a8a8a" font-weight="normal">SCALE</text><text x="1302.0" y="1000.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="bold">NTS</text><text x="1447.0" y="917.0" font-size="9" text-anchor="start" fill="#8a8a8a" font-weight="normal">SHEET</text><text x="1447.0" y="934.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="bold">1/1</text><text x="1447.0" y="950.0" font-size="9" text-anchor="start" fill="#8a8a8a" font-weight="normal">DWG NO</text><text x="1447.0" y="967.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="bold">AF-H-101</text><text x="1447.0" y="983.0" font-size="9" text-anchor="start" fill="#8a8a8a" font-weight="normal">UNITS</text><text x="1447.0" y="1000.0" font-size="12" text-anchor="start" fill="#1c1c1c" font-weight="bold">mm</text><text x="48.0" y="1038.0" font-size="10" text-anchor="start" fill="#b3261e" font-weight="normal">EMEBET INC. — PROPRIETARY &amp; CONFIDENTIAL</text></svg></div></body></html>
