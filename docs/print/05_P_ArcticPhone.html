ASS MESH CITIZEN — your phone extends the network.</text><text x="910.0" y="531.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Satellite SOS as a core feature, not an accessory — for places towers aren't.</text><text x="910.0" y="554.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Offline-first: apps, maps, forms, messaging all useful with zero bars.</text><text x="910.0" y="577.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Community-owned: the network your phone joins belongs to your community.</text><text x="910.0" y="600.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Repairable by design — a local tech fixes it with hand tools.</text><text x="900.0" y="700.0" font-size="15" text-anchor="start" fill="#1c1c1c" font-weight="bold" letter-spacing="1">RELATIONSHIP TO OTHER NODES</text><text x="910.0" y="728.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Phone = personal node; L1 = field/shared; Totem = public; Mite = environmental; Anchor =</text><text x="922.0" y="748.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">infrastructure.</text><text x="910.0" y="771.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— All speak the same signed mesh — a call routes phone→phone→brick→satellite.</text><text x="910.0" y="794.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="normal">— Phone is the highest-volume node — its radio is the network's user terminal.</text><rect x="1032.0" y="896.0" width="560.0" height="120.0" rx="0" fill="none" stroke="#1c1c1c" stroke-width="1.4"/><line x1="1282.0" y1="896.0" x2="1282.0" y2="1016.0" stroke="#1c1c1c" stroke-width="1"/><text x="1044.0" y="916.0" font-size="13" text-anchor="start" fill="#1c1c1c" font-weight="bold">ARCTICCHAIN — RURAL NODE FLEET</text><text x="1044.0" y="934.0" font-size="12" text-anchor="start" fill="#1a4f8a" font-
