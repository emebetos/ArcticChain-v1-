<text x="1056.0" y="963.0" font-size="9.5" text-anchor="start" fill="#8fc1ea" font-weight="normal">· reports via cluster heads</text>
<text x="1056.0" y="976.0" font-size="9.5" text-anchor="start" fill="#8fc1ea" font-weight="normal">· zero e-waste, no retrieval</text>
<text x="60.0" y="1007.0" font-size="14" text-anchor="start" fill="#d8ecff" font-weight="bold">SHARED NODE DNA — what makes them one network</text>
<text x="60.0" y="1033.0" font-size="11.5" text-anchor="start" fill="#ffd479" font-weight="bold">signed identity</text>
<text x="230.0" y="1033.0" font-size="11" text-anchor="start" fill="#8fc1ea" font-weight="normal">every node holds an Ed25519 key — envelopes are signed, replay-protected</text>
<text x="800.0" y="1033.0" font-size="11.5" text-anchor="start" fill="#ffd479" font-weight="bold">store-and-forward</text>
<text x="970.0" y="1033.0" font-size="11" text-anchor="start" fill="#8fc1ea" font-weight="normal">SQLite queue on every node — messages survive days without backhaul</text>
<text x="60.0" y="1067.0" font-size="11.5" text-anchor="start" fill="#ffd479" font-weight="bold">one radio plan</text>
<text x="230.0" y="1067.0" font-size="11" text-anchor="start" fill="#8fc1ea" font-weight="normal">LoRa 915 MHz ISM (Canada) everywhere; LTE/sat only as backhaul</text>
<text x="800.0" y="1067.0" font-size="11.5" text-anchor="start" fill="#ffd479" font-weight="bold">same agent</text>
<text x="970.0" y="1067.0" font-size="11" text-anchor="start" fill="#8fc1ea" font-weight="normal">poc/arcticchain_agent.py HTTP API (:8080) runs on every node type</text>
<text x="60.0" y="1125.0" font-size="14" text-anchor="start" fill="#d8ecff" font-weight="bold">HORIZON</text>
<text x="60.0" y="1147.0" font-size="11" text-anchor="start" fill="#8fc1ea" font-weight="normal">D Seed (degradable motes) and H Meridian (CubeSat payload — the mesh IS the ground segment) are</text>
<text x="60.0" y="1165.0" font-size="11" text-anchor="start" fill="#8fc1ea" font-weight="normal">earned stages, not skipped rungs. See docs/HARDWARE.md §5 for the design sequence.</text>
